<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPFC - Secure Workspace Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-color: #5B4EFA; 
            --brand-gradient: linear-gradient(135deg, #5B4EFA 0%, #3b28cc 100%);
            --accent-color: #E2A03F; 
            --bg-color: #F4F7FE;
            --card-bg: #ffffff;
            --text-main: #2B3674;
            --text-muted: #A3AED0;
            --border-color: #E2E8F0;
            --error-color: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        .login-wrapper { display: flex; width: 900px; max-width: 95%; background: var(--card-bg); border-radius: 24px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); overflow: hidden; }
        
        .login-left { width: 45%; background: var(--brand-gradient); padding: 50px 40px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; color: white; position: relative; overflow: hidden; }
        .login-left::before { content: ''; position: absolute; top: -50px; left: -50px; width: 200px; height: 200px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .login-left::after { content: ''; position: absolute; bottom: -80px; right: -50px; width: 250px; height: 250px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        .brand-logo { font-size: 32px; font-weight: 800; color: var(--accent-color); margin-bottom: 20px; z-index: 1; }
        .brand-title { font-size: 28px; font-weight: 700; margin-bottom: 15px; line-height: 1.3; z-index: 1; }
        .brand-subtitle { font-size: 14px; font-weight: 400; opacity: 0.8; line-height: 1.6; z-index: 1; }

        .login-right { width: 55%; padding: 60px 50px; display: flex; flex-direction: column; justify-content: center; }
        .login-header { margin-bottom: 35px; }
        .login-header h2 { font-size: 26px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .login-header p { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px 15px 14px 45px; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 14px; font-weight: 500; outline: none; transition: 0.3s; background: #fafafa; }
        .input-group input:focus { border-color: var(--brand-color); background: #ffffff; box-shadow: 0 0 0 4px rgba(91, 78, 250, 0.1); }
        .input-group i { position: absolute; bottom: 15px; left: 16px; font-size: 16px; color: var(--text-muted); transition: 0.3s; }
        .input-group input:focus + i { color: var(--brand-color); }
        
        #errorMsg { color: var(--error-color); font-size: 13px; font-weight: 600; margin-bottom: 20px; display: none; background: #fee2e2; padding: 10px 15px; border-radius: 8px; border: 1px solid #fca5a5; }
        
        .btn-login { width: 100%; padding: 15px; background: var(--brand-color); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-login:hover { background: var(--brand-gradient); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91, 78, 250, 0.4); }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { font-size: 40px; color: var(--brand-color); margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Loading Screen while checking if user is already logged in -->
    <div id="pageLoader">
        <i class="fas fa-circle-notch fa-spin spinner"></i>
        <h3 id="loaderText" style="color:var(--text-main); font-size: 16px;">Verifying Secure Connection...</h3>
    </div>

    <!-- Login Form UI -->
    <div class="login-wrapper" id="loginUI" style="display: none;">
        <div class="login-left">
            <div class="brand-logo">VPFC</div>
            <h1 class="brand-title">Workspace<br>Portal</h1>
            <p class="brand-subtitle">Secure access portal for Telecallers and System Administrators.</p>
        </div>
        <div class="login-right">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Please sign in to access your dashboard</p>
            </div>
            <div id="errorMsg"></div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address / Login ID</label>
                    <input type="email" id="email" placeholder="E.g. tw01@vpfc.com" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvjFcKKiu4OMmQckYXMTejdBJh9tC6TjM",
            authDomain: "sri-vishnu-priya-finance-c591f.firebaseapp.com",
            databaseURL: "https://sri-vishnu-priya-finance-c591f-default-rtdb.firebaseio.com",
            projectId: "sri-vishnu-priya-finance-c591f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // CHECK IF USER IS ALREADY LOGGED IN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                let tcId = user.email.split('@')[0];
                try {
                    let snap = await get(child(ref(db), `telewingsUsers/${tcId.toUpperCase()}`));
                    if (!snap.exists()) snap = await get(child(ref(db), `telewingsUsers/${tcId.toLowerCase()}`));

                    if (snap.exists()) {
                        const userData = snap.val();
                        // REDIRECT BASED ON ROLE
                        if (userData.role === 'Admin' || userData.role === 'head') {
                            window.location.href = "admin-dashboard.html"; // Admin Dashboard
                        } else {
                            window.location.href = "tc-dashboard.html"; // Telecaller Dashboard
                        }
                    } else {
                        await signOut(auth);
                        showError("User data not found. Contact Admin.");
                    }
                } catch(e) {
                    await signOut(auth);
                    showError("Connection error while verifying role.");
                }
            } else {
                // Show Login Screen if not logged in
                document.getElementById('pageLoader').style.display = 'none';
                document.getElementById('loginUI').style.display = 'flex';
            }
        });

        // SHOW ERROR FUNCTION
        function showError(msg) {
            document.getElementById('pageLoader').style.display = 'none';
            document.getElementById('loginUI').style.display = 'flex';
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = `<i class="fas fa-shield-alt"></i> ${msg}`;
        }

        // HANDLE LOGIN BUTTON CLICK
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            errorMsg.style.display = 'none';

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In <i class="fas fa-arrow-right"></i>';
                    showError("Incorrect Email or Password.");
                });
        });
    </script>
</body>
</html>
